name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Browsers
        run: |
          bunx playwright install --with-deps chromium
          bunx patchright install chromium
      - run: bun test
        env:
          XYTE_TEST_REDIS_URL: redis://127.0.0.1:6379
      - name: Coverage doc is up to date
        run: bun scripts/coverage.ts && git diff --exit-code docs/coverage.md
      - run: bun run build
      # docs/api.md is generated from the doc comments: fails if it's stale or an export lacks one.
      - run: bun scripts/api-docs.ts --check
      - run: bunx publint
      # The docs site builds, with no dead links (it fails on one).
      - run: bun run site:build

  node:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Built here rather than passed as an artifact: it takes a second.
      - run: bun run build
      - run: node --test test/node/smoke.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xyte:slim --target slim .
      - name: Smoke
        run: |
          docker run -d --name xyte -p 8080:8080 -e XYTE_API_KEYS=ci xyte:slim
          for _ in $(seq 1 20); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf -u ci: localhost:8080/v1/extract -d '{"url":"https://example.com","httpResponseBody":true}' | grep -q '"statusCode":200'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/extract -d '{}')" = 401
